<!DOCTYPE html>

    <title>Govoreči slikovni slovar in zlogovalnik</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                        display: ['Fredoka', 'sans-serif'],
                    },
                    animation: {
                        'bounce-short': 'bounceShort 0.5s ease-in-out',
                        'pulse-glow': 'pulseGlow 1.2s infinite',
                        'pop': 'pop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                    },
                    keyframes: {
                        bounceShort: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { transform: 'scale(1)', opacity: '1' },
                            '50%': { transform: 'scale(1.06)', opacity: '0.9' },
                        },
                        pop: {
                            '0%': { transform: 'scale(0.85)', opacity: '0.5' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

            user-select: none;
            -webkit-tap-highlight-color: transparent;

            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.15);

            box-shadow: 0 12px 24px -4px rgba(0, 0, 0, 0.25), 0 0 0 4px #ffffff, 0 0 0 8px currentColor !important;
            z-index: 20;
        }
    </style>
</head>
<body class="text-slate-800 flex flex-col justify-between p-3 sm:p-5 md:p-6">

    <!-- OBVESTILNO OKENCE (Toast namesto alert) -->

    <script>
        /**
         * ============================================================================
         * 1. PAMETNI SLOVENSKI ZLOGOVALNIK (Algoritem za delitev besed na zloge)
         * ============================================================================
         * Pravila slovenščine:
         * - Nosilci zloga so samoglasniki: A, E, I, O, U (ter naglašene različice).
         * - Zlogotvorni R: R deluje kot samoglasnik, kadar stoji med dvema soglasnikoma
         *   (npr. VRT, PRST, TRG, ČRKA, SMRK) ali na začetku besede pred soglasnikom (RDEČ, RJAV).
         * - Soglasnik med dvema samoglasnikoma gre k naslednjemu zlogu (MI-ZA, HI-ŠA).
         * - Soglasniški sklopi:
         *   - Dva enaka soglasnika se ločita (OD-DA-JA).
         *   - Sklop z nezvočnikom + zvočnikom (npr. TR, PR, KR, PL, SL, SM, SN, ŠK, ST, ZD, GR, GL, BR, BL, DR, DL, FR, FL, HR, HL, VR, VL, KV, SV, ZV, ŽV) ostane skupaj na začetku naslednjega zloga.
         *   - Ostali sklopi se običajno delijo po prvem soglasniku (JA-BOL-KO, MAČ-KA, SON-CE, ME-TULJ).
         */
        function syllabifySlovenian(rawWord) {
            if (!rawWord) return [];
            const word = rawWord.trim().toUpperCase().replace(/[^A-ZČŠŽĆĐÁÉÍÓÚÀÈÌÒÙÊÔ]/g, '');
            if (word.length <= 2) return [word];

            const vowels = new Set(['A', 'E', 'I', 'O', 'U', 'Á', 'É', 'Í', 'Ó', 'Ú', 'À', 'È', 'Ì', 'Ò', 'Ù', 'Ê', 'Ô']);
            const isVowel = (ch) => vowels.has(ch);

            // Ugotovi, ali je 'R' na poziciji i zlogotvoren (med soglasnikoma ali na začetku pred soglasnikom)
            const isSyllabicR = (w, i) => {
                if (w[i] !== 'R') return false;
                const prevIsVowel = i > 0 && isVowel(w[i - 1]);
                const nextIsVowel = i < w.length - 1 && isVowel(w[i + 1]);
                if (prevIsVowel || nextIsVowel) return false;
                // Če je na začetku pred soglasnikom (npr. R-DEČ) ali med dvema soglasnikoma (npr. V-R-T, Č-R-KA)
                if (i === 0 && w.length > 1 && !isVowel(w[1])) return true;
                if (i > 0 && i < w.length - 1 && !isVowel(w[i - 1]) && !isVowel(w[i + 1])) return true;
                return false;
            };

            // Poišči indekse vseh zlogovnih jeder (samoglasniki + zlogotvorni R)
            const nuclei = [];
            for (let i = 0; i < word.length; i++) {
                if (isVowel(word[i]) || isSyllabicR(word, i)) {
                    nuclei.push(i);
                }
            }

            // Če beseda nima samoglasnikov (npr. kratica), vrni celo
            if (nuclei.length <= 1) return [word];

            // Sklopi soglasnikov, ki v slovenščini običajno začnejo nov zlog (ne ločimo jih)
            const onsetClusters = new Set([
                'BL', 'BR', 'CL', 'CR', 'ČL', 'ČR', 'DL', 'DR', 'FL', 'FR',
                'GL', 'GR', 'HL', 'HR', 'KL', 'KR', 'KV', 'ML', 'MR', 'PL',
                'PR', 'SL', 'SM', 'SN', 'SP', 'SR', 'ST', 'SV', 'ŠK', 'ŠL',
                'ŠM', 'ŠN', 'ŠP', 'ŠR', 'ŠT', 'ŠV', 'TL', 'TR', 'TV', 'VL',
                'VR', 'ZD', 'ZG', 'ZL', 'ZM', 'ZN', 'ZR', 'ZV', 'ŽG', 'ŽL',
                'ŽM', 'ŽN', 'ŽR', 'ŽV', 'SK', 'SC', 'SČ', 'ŠČ', 'KN', 'GN', 'PN', 'PS', 'PT', 'KT'
            ]);

            const splitPoints = [0];

            for (let n = 0; n < nuclei.length - 1; n++) {
                const startConsonants = nuclei[n] + 1;
                const endConsonants = nuclei[n + 1]; // ekskluzivno
                const consonantCount = endConsonants - startConsonants;

                if (consonantCount === 0) {
                    // Dva samoglasnika skupaj (npr. A-VTO -> AV-TO je sicer V soglasnik, a npr. PO-UK, KA-KAO -> KA-KA-O)
                    splitPoints.push(endConsonants);
                } else if (consonantCount === 1) {
                    // En soglasnik med samoglasnikoma gre k naslednjemu zlogu (MI-ZA, BA-NA-NA)
                    splitPoints.push(startConsonants);
                } else if (consonantCount === 2) {
                    const pair = word.slice(startConsonants, endConsonants);
                    if (onsetClusters.has(pair)) {
                        // Sklop ostane skupaj pri drugem zlogu (SE-STRA -> SES-TRA / SE-STRA)
                        splitPoints.push(startConsonants);
                    } else {
                        // Razdeli med soglasnikoma (MAČ-KA, SON-CE, JABOL-KO -> JA-BOL-KO)
                        splitPoints.push(startConsonants + 1);
                    }
                } else {
                    // 3 ali več soglasnikov: preveri zadnja dva, če tvorita veljaven začetni sklop
                    const lastTwo = word.slice(endConsonants - 2, endConsonants);
                    if (onsetClusters.has(lastTwo)) {
                        splitPoints.push(endConsonants - 2);
                    } else {
                        splitPoints.push(endConsonants - 1);
                    }
                }
            }

            splitPoints.push(word.length);

            const syllables = [];
            for (let i = 0; i < splitPoints.length - 1; i++) {
                const part = word.slice(splitPoints[i], splitPoints[i + 1]);
                if (part) syllables.push(part);
            }

            return syllables;
        }

        /**
         * ============================================================================
         * 2. VNAPREJ PRIPRAVLJEN SLOVAR S KAKOVOSTNIMI VEKTORSKIMI ILUSTRACIJAMI (SVG)
         * ============================================================================
         */
        const DEFAULT_WORDS = [
            {
                word: "MIZA",
                syllables: ["MI", "ZA"],
                svg: `<svg viewBox="0 0 200 200" class="w-full h-full drop-shadow-md">
                        <ellipse cx="100" cy="175" rx="75" ry="10" fill="#cbd5e1" opacity="0.5"/>
                        <rect x="38" y="95" width="14" height="75" rx="4" fill="#92400e"/>
                        <rect x="148" y="95" width="14" height="75" rx="4" fill="#92400e"/>

        // Inicializacija glasov brskalnika
        function initVoices() {
            if (!('speechSynthesis' in window)) {
                updateVoiceStatus('Brskalnik ne podpira govorne sinteze.', false);
                return;
            }

            availableVoices = window.speechSynthesis.getVoices();
            const voiceSelect = document.getElementById('voiceSelect');
            if (!voiceSelect) return;

            voiceSelect.innerHTML = '';

            if (availableVoices.length === 0) {
                voiceSelect.innerHTML = '<option value="">Privzeti glas sistema</option>';
                return;
            }

            // Razvrsti: najprej sl-SI, nato hr-HR / sr-RS / bs-BA, nato ostali
            const sortedVoices = [...availableVoices].sort((a, b) => {
                const score = (v) => {
                    const lang = v.lang.toLowerCase();
                    if (lang.startsWith('sl')) return 1;
                    if (lang.startsWith('hr') || lang.startsWith('sr') || lang.startsWith('bs')) return 2;
                    return 3;
                };
                return score(a) - score(b);
            });

            sortedVoices.forEach((voice) => {
                const option = document.createElement('option');
                option.value = voice.name;
                option.textContent = `${voice.name} (${voice.lang})`;
                voiceSelect.appendChild(option);
            });

            // Izberi najboljšega
            const bestVoice = sortedVoices[0];
            if (bestVoice) {
                selectedVoice = bestVoice;
                voiceSelect.value = bestVoice.name;

                const lang = bestVoice.lang.toLowerCase();
                if (lang.startsWith('sl')) {
                    updateVoiceStatus('✅ Slovenski glas (sl-SI) je aktiven', true);
                } else if (lang.startsWith('hr') || lang.startsWith('sr')) {
                    updateVoiceStatus('ℹ️ Uporabljen sorodni južnoslovanski glas (' + bestVoice.lang + ')', true);
                } else {
                    updateVoiceStatus('⚠️ Slovenski glas ni nameščen v napravi (uporabljen: ' + bestVoice.lang + ')', false);
                }
            }
        }

        function updateVoiceStatus(msg, isOptimal) {
            const badge = document.getElementById('voiceStatusBadge');
            if (!badge) return;
            badge.textContent = msg;
            badge.className = isOptimal ? 'font-bold text-emerald-700' : 'font-bold text-amber-700';
        }

        function changeSelectedVoice() {
            const voiceSelect = document.getElementById('voiceSelect');
            const chosen = availableVoices.find(v => v.name === voiceSelect.value);
            if (chosen) {
                selectedVoice = chosen;
                speakText(wordsList[currentIndex].word.toLowerCase(), 0.75);
            }
        }

        // Glavna funkcija za izgovorjavo besedila
        function speakText(text, rate = 0.75, onEndCallback = null) {
            if (!('speechSynthesis' in window)) {
                showToast('Vaš brskalnik žal ne podpira zvočnega branja.');
                if (onEndCallback) onEndCallback();
                return;
            }

            window.speechSynthesis.cancel();
            const indicator = document.getElementById('speakingIndicator');

            // Zapis z malimi črkami prepreči, da bi bralnik besedo črkoval kot kratico (npr. M-I-Z-A namesto miza)
            const cleanText = text.toLowerCase();

            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'sl-SI';
            utterance.rate = rate;
            utterance.pitch = 1.05; // Rahlo toplejši, prijazen ton za otroke

            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            utterance.onstart = () => {
                if (indicator) {
                    indicator.classList.remove('hidden');
                    indicator.classList.add('flex');
                }
            };

            utterance.onend = () => {
                if (indicator) {
                    indicator.classList.add('hidden');
                    indicator.classList.remove('flex');
                }
                if (onEndCallback) onEndCallback();
            };

            utterance.onerror = () => {
                if (indicator) {
                    indicator.classList.add('hidden');
                    indicator.classList.remove('flex');
                }
                if (onEndCallback) onEndCallback();
            };

            window.speechSynthesis.speak(utterance);
        }

        // Pripravi besedilo posameznega zloga tako, da ga TTS prebere kot zlog in ne črkuje
        function prepareSyllableForSpeech(syllable) {
            let s = syllable.toLowerCase();
            // Če je zlog sestavljen iz ene same črke (npr. "a" ali "o") ali soglasnika, ga ohranimo kratkega
            return s;
        }

        /**
         * ============================================================================
         * 5. UPRAVLJANJE PRIKAZA IN INTERAKCIJ
         * ============================================================================
         */
        function renderCarousel() {
            const carousel = document.getElementById('wordCarousel');
            carousel.innerHTML = '';

            wordsList.forEach((item, idx) => {
                const isActive = idx === currentIndex;
                const btn = document.createElement('button');
                btn.onclick = () => selectWord(idx);
                btn.className = `shrink-0 px-3.5 py-2 rounded-xl font-display font-bold text-sm sm:text-base transition cursor-pointer flex items-center gap-1.5 ${
                    isActive 
                    ? 'bg-sky-500 text-white shadow-md scale-105' 
                    : 'bg-slate-100 hover:bg-sky-100 text-slate-700'
                }`;
                
                const iconSpan = item.emoji ? `<span>${item.emoji}</span>` : '';
                btn.innerHTML = `${iconSpan}<span>${item.word}</span>`;
                carousel.appendChild(btn);

                if (isActive) {
                    setTimeout(() => {
                        btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    }, 50);
                }
            });
        }

                            <span class="font-display text-3xl sm:text-5xl md:text-6xl font-extrabold text-white tracking-wide drop-shadow-sm">
                                ${syl}
                            </span>
                        </button>
                    `;
                }).join('<span class="text-slate-300 font-black text-2xl sm:text-4xl mx-0.5">-</span>');

                display.innerHTML = `
                    <div class="flex flex-wrap items-center justify-center gap-2 sm:gap-3 px-2">
                        ${pillsHtml}
                    </div>
                `;
                hint.textContent = '👆 Klikni na posamezen obarvan zlog, da ga slišiš!';
            } 
            else if (currentMode === 'initial') {
                const firstLetter = item.word.charAt(0);
                const restOfWord = item.word.slice(1);
                const phonetic = PHONETIC_INITIALS[firstLetter] || { soundDisplay: firstLetter.toLowerCase(), speakText: firstLetter.toLowerCase() };

                display.innerHTML = `
                    <div class="flex flex-col items-center gap-2 animate-pop">
                        <div class="flex items-center justify-center gap-2 sm:gap-4 bg-emerald-50 border-2 border-emerald-200 px-5 py-2.5 rounded-3xl shadow-sm">
                            <span class="font-display text-4xl sm:text-6xl font-black text-emerald-600 bg-white w-14 h-14 sm:w-20 sm:h-20 rounded-2xl flex items-center justify-center shadow-sm border border-emerald-200">
                                ${firstLetter}
                            </span>
                            <span class="text-emerald-400 font-black text-2xl sm:text-3xl">—</span>
                            <span class="font-display text-3xl sm:text-5xl font-bold text-teal-700 italic px-2">
                                "${phonetic.soundDisplay}"
                            </span>
                            <span class="text-emerald-400 font-black text-2xl sm:text-3xl">—</span>
                            <span class="font-display text-3xl sm:text-5xl font-extrabold tracking-wide text-slate-800">
                                <span class="text-emerald-600 underline decoration-4 underline-offset-4">${firstLetter}</span>${restOfWord}
                            </span>
                        </div>
                    </div>
                `;
                hint.textContent = `Beseda ${item.word} se začne na glas "${phonetic.soundDisplay}" (črka ${firstLetter}).`;
            }
        }

        function updateModeButtonsUI() {
            const btnWord = document.getElementById('btnSpeakWord');
            const btnSyl = document.getElementById('btnSyllables');
            const btnInit = document.getElementById('btnInitialSound');

            [btnWord, btnSyl, btnInit].forEach(b => b.classList.remove('ring-4', 'ring-offset-2', 'ring-slate-800/30', 'scale-[1.02]'));

            if (currentMode === 'word') btnWord.classList.add('ring-4', 'ring-offset-2', 'ring-sky-400', 'scale-[1.02]');
            if (currentMode === 'syllables') btnSyl.classList.add('ring-4', 'ring-offset-2', 'ring-amber-400', 'scale-[1.02]');
            if (currentMode === 'initial') btnInit.classList.add('ring-4', 'ring-offset-2', 'ring-emerald-400', 'scale-[1.02]');
        }

        // GUMB 1: Poslušaj celo besedo počasi
        function activateWordMode() {
            currentMode = 'word';
            renderCard();
            speakCurrentWordSlow();
        }

        function speakCurrentWordSlow() {
            const item = wordsList[currentIndex];
            const illusBox = document.getElementById('illustrationBox');
            illusBox.classList.add('animate-bounce-short');
            setTimeout(() => illusBox.classList.remove('animate-bounce-short'), 600);

            speakText(item.word, 0.72);
        }

        // GUMB 2: Zlogovanje (zaporedno prebere in osvetli vse zloge)
        function activateSyllableMode() {
            currentMode = 'syllables';
            renderCard();
            playAllSyllablesSequentially();
        }

        function playAllSyllablesSequentially() {
            clearTimeout(speechTimer);
            const item = wordsList[currentIndex];
            let idx = 0;

            function step() {
                if (currentMode !== 'syllables' || idx >= item.syllables.length) return;
                highlightSyllablePill(idx);
                const sylSpeech = prepareSyllableForSpeech(item.syllables[idx]);
                
                speakText(sylSpeech, 0.72, () => {
                    idx++;
                    if (idx < item.syllables.length && currentMode === 'syllables') {
                        speechTimer = setTimeout(step, 260);
                    }
                });
            }

            step();
        }

        function highlightSyllablePill(index) {
            // Odstrani aktivni razred z vseh
            document.querySelectorAll('.syllable-pill').forEach(el => el.classList.remove('syllable-active'));
            const pill = document.getElementById(`syl-pill-${index}`);
            if (pill) {
                pill.classList.add('syllable-active');
                setTimeout(() => {
                    pill.classList.remove('syllable-active');
                }, 850);
            }
        }

        // Klik na posamezen zlog
        function speakSingleSyllable(index) {
            clearTimeout(speechTimer);
            const item = wordsList[currentIndex];
            const syl = item.syllables[index];
            if (!syl) return;

            highlightSyllablePill(index);
            speakText(prepareSyllableForSpeech(syl), 0.72);
        }

        // GUMB 3: Začetni glas
        function activateInitialSoundMode() {
            currentMode = 'initial';
            renderCard();

            const item = wordsList[currentIndex];
            const firstLetter = item.word.charAt(0);
            const phonetic = PHONETIC_INITIALS[firstLetter] || { soundDisplay: firstLetter.toLowerCase(), speakText: firstLetter.toLowerCase() };

            // Najprej izgovori prvi glas, nato po kratkem premoru še celo besedo
            speakText(phonetic.speakText, 0.68, () => {
                if (currentMode === 'initial') {
                    speechTimer = setTimeout(() => {
                        speakText(item.word, 0.75);
                    }, 350);
                }
            });
        }

        // Navigacija med besedami
        function selectWord(index) {
            currentIndex = index;
            currentMode = 'word';
            renderCarousel();
            renderCard();
            speakCurrentWordSlow();
        }

        function prevWord() {
            const nextIdx = (currentIndex - 1 + wordsList.length) % wordsList.length;
            selectWord(nextIdx);
        }

        function nextWord() {
            const nextIdx = (currentIndex + 1) % wordsList.length;
            selectWord(nextIdx);
        }

        /**
         * ============================================================================
         * 6. UČITELJSKI KOTIČEK - DODAJANJE POLJUBNIH BESED
         * ============================================================================
         */
        function toggleTeacherPanel() {
            const panel = document.getElementById('teacherPanel');
            const chevron = document.getElementById('teacherChevron');
            const isHidden = panel.classList.contains('hidden');

            if (isHidden) {
                panel.classList.remove('hidden');
                chevron.style.transform = 'rotate(180deg)';
                document.getElementById('customWordInput').focus();
            } else {
                panel.classList.add('hidden');
                chevron.style.transform = 'rotate(0deg)';
            }
        }

        function setEmoji(emoji) {
            document.getElementById('customEmojiInput').value = emoji;
        }

        function updateLiveSyllablePreview() {
            const wordInput = document.getElementById('customWordInput').value;
            const sylInput = document.getElementById('customSyllablesInput');
            const autoSyllables = syllabifySlovenian(wordInput);
            sylInput.value = autoSyllables.join('-');
        }

        function handleCustomWord(event) {
            event.preventDefault();
            const rawWord = document.getElementById('customWordInput').value.trim().toUpperCase();
            const rawSyl = document.getElementById('customSyllablesInput').value.trim().toUpperCase();
            const emoji = document.getElementById('customEmojiInput').value.trim() || '🌟';

            if (!rawWord) return;

            // Očisti besedo dovoljenih znakov
            const cleanWord = rawWord.replace(/[^A-ZČŠŽĆĐ]/g, '');
            if (!cleanWord) {
                showToast('Prosimo, vpišite veljavno slovensko besedo.');
                return;
            }

            // Pridobi zloge iz polja (če jih je učiteljica ročno popravila) ali iz algoritma
            let finalSyllables = rawSyl
                .split('-')
                .map(s => s.replace(/[^A-ZČŠŽĆĐ]/g, ''))
                .filter(s => s.length > 0);

            if (finalSyllables.length === 0 || finalSyllables.join('') !== cleanWord) {
                finalSyllables = syllabifySlovenian(cleanWord);
            }

            // Preveri, če beseda že obstaja v seznamu
            const existingIdx = wordsList.findIndex(w => w.word === cleanWord);
            if (existingIdx !== -1) {
                wordsList[existingIdx].syllables = finalSyllables;
                if (!wordsList[existingIdx].svg) {
                    wordsList[existingIdx].emoji = emoji;
                }
                selectWord(existingIdx);
                showToast(`Beseda "${cleanWord}" je posodobljena!`);
            } else {
                // Dodaj novo besedo na začetek seznama
                wordsList.unshift({
                    word: cleanWord,
                    syllables: finalSyllables,
                    emoji: emoji
                });
                selectWord(0);
                showToast(`Dodana nova beseda: ${finalSyllables.join(' - ')}`);
            }

            // Počisti vnosna polja in zapri učiteljski panel za nemoteno delo z otrokom
            document.getElementById('customWordInput').value = '';
            document.getElementById('customSyllablesInput').value = '';
            toggleTeacherPanel();
        }

        function showToast(message) {
            const toast = document.getElementById('toastMessage');
            toast.textContent = message;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 3000);
        }

        // Podpora za tipkovnico (puščice levo/desno, preslednica za branje)
        document.addEventListener('keydown', (e) => {
            if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT') return;
            if (e.key === 'ArrowRight') nextWord();
            if (e.key === 'ArrowLeft') prevWord();
            if (e.key === ' ') {
                e.preventDefault();
                speakCurrentWordSlow();
            }
        });

        // Zagon ob nalaganju strani
        window.addEventListener('DOMContentLoaded', () => {
            initVoices();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.onvoiceschanged = initVoices;
            }
            renderCarousel();
            renderCard();
        });
    </script>
</body>
</html>
